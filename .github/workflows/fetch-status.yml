name: 抓取公益站状态

on:
  schedule:
    - cron: "13 */3 * * *" # 每 3 小时（UTC）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-status
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取状态并生成 live.json
        run: python scripts/fetch_status.py > assets/live.json

      - name: 有变化则提交（触发 Pages 更新）
        run: |
          git config user.name "xusuo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动抓取公益站状态"
            git push
          fi
