name: 抓取公益站状态

on:
  schedule:
    # 每小时的 7、32、57 分各跑一次（cron 无法精确表达 25 分钟间隔，
    # 该组合为最接近的均匀方案：25/25/10 分钟循环）
    - cron: "7,32,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-status
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取状态并生成 live.json
        env:
          # 可选：在各站控制台创建 sk- 令牌后用 gh secret set 配置，
          # 未配置的站点自动退回公开接口抓取
          XUSUO_TOKEN_AGENTROUTER: ${{ secrets.XUSUO_TOKEN_AGENTROUTER }}
          XUSUO_TOKEN_JUSTWOKER: ${{ secrets.XUSUO_TOKEN_JUSTWOKER }}
          XUSUO_TOKEN_GOROUTER: ${{ secrets.XUSUO_TOKEN_GOROUTER }}
          XUSUO_TOKEN_TABIAI: ${{ secrets.XUSUO_TOKEN_TABIAI }}
          XUSUO_TOKEN_KKTOKEN: ${{ secrets.XUSUO_TOKEN_KKTOKEN }}
          XUSUO_TOKEN_SEEKAI: ${{ secrets.XUSUO_TOKEN_SEEKAI }}
          XUSUO_TOKEN_HAJIMI: ${{ secrets.XUSUO_TOKEN_HAJIMI }}
        run: |
          # 先写临时文件再覆盖：脚本需要读取现有 live.json 做状态延续合并
          python scripts/fetch_status.py > live.tmp.json
          mv live.tmp.json assets/live.json

      - name: 有变化则提交（触发 Pages 更新）
        run: |
          git config user.name "xusuo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动抓取公益站状态"
            git push
          fi
